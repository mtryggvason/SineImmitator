<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Record any sound and hear it imitated using only sine waves.">
  <title>Sine Wave Imitator</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="scripts/main.js"></script>
</head>
<body>
  <main class="app">
    <header class="hero">
      <h1>Fun with sine waves</h1>
      <p>Record whatever you like and the computer will try to imitate it using only sine waves.</p>
    </header>

    <section class="stage" aria-label="Spectrum">
      <canvas aria-label="Frequency spectrum with the chosen sine partials highlighted"></canvas>
      <p class="status js-status" role="status"></p>
    </section>

    <section class="controls">
      <button type="button" class="record js-record" aria-pressed="false">
        <i class="record__dot" aria-hidden="true"></i><span>Record</span>
      </button>
      <label class="slider">
        <span>Sine waves <output class="js-count-value">8</output></span>
        <input class="js-count" type="range" min="1" max="64" value="8">
      </label>
    </section>

    <section class="recordings" aria-labelledby="recordings-title">
      <h2 id="recordings-title">Recordings</h2>
      <p class="recordings__empty js-empty">Nothing yet. Hit record, then stop to hear the result.</p>
      <ul class="js-recordings"></ul>
    </section>
  </main>
</body>
</html>
